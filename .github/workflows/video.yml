name: Créer une vidéo
run-name: "🎬 ${{ inputs.sujet }} [${{ inputs.uid }}]"
on:
  workflow_dispatch:
    inputs:
      texte: {description: "Identifiant du texte", required: true}
      sujet: {description: "Sujet (affichage)", required: false, default: "vidéo"}
      uid: {description: "Identifiant unique de la demande", required: true}
      voix: {description: "Fichier voix MP3 dans le dépôt (facultatif)", required: false, default: ""}
permissions:
  contents: write
jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Vérification de la demande
        env: {TEXTE: "${{ inputs.texte }}", UID_: "${{ inputs.uid }}", VOIX: "${{ inputs.voix }}"}
        run: |
          [[ "$TEXTE" =~ ^[a-z0-9]{1,20}$ ]] || { echo "::error::Identifiant de texte invalide"; exit 1; }
          [[ "$UID_" =~ ^[a-z0-9]{1,20}$ ]] || { echo "::error::Identifiant de demande invalide"; exit 1; }
          [[ -z "$VOIX" || "$VOIX" =~ ^data/voix/[a-z0-9]{1,20}\.mp3$ ]] || { echo "::error::Chemin de voix invalide"; exit 1; }
      - name: Outils (ffmpeg)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-liberation > /dev/null
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip, cache-dependency-path: app/requirements-moteur.txt}
      - name: Bibliothèques Python
        run: |
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q -r app/requirements-moteur.txt
      - name: Modèles (cache)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            modele_asr
          key: modeles-v1
      - name: Modèle de reconnaissance vocale
        run: |
          if [ ! -d modele_asr ]; then
            curl -sSL -o /tmp/m.tar.bz2 https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-nemo-parakeet-tdt-0.6b-v3-int8.tar.bz2
            tar xjf /tmp/m.tar.bz2 && mv sherpa-onnx-nemo-parakeet-tdt-0.6b-v3-int8 modele_asr
          fi
      - name: Fabrication de la vidéo
        env:
          TEXTE: ${{ inputs.texte }}
          VOIX: ${{ inputs.voix }}
          SECRETS: ${{ toJSON(secrets) }}
          SHERPA_MODEL: ${{ github.workspace }}/modele_asr
          LIBRARY_INDEX: ${{ github.workspace }}/app/library_index.npz
          ENGINE_PYTHON: python
        run: python gh_job.py "$TEXTE" "$VOIX"
      - name: Publication de la vidéo
        env: {GH_TOKEN: "${{ github.token }}", SUJET: "${{ inputs.sujet }}", UID_: "${{ inputs.uid }}"}
        run: gh release create "video-$UID_" out/video.mp4 out/miniature.jpg --title "$SUJET" --notes-file out/description.txt --target "$GITHUB_SHA"
      - name: Transmission à l'appli
        uses: actions/upload-artifact@v4
        with: {name: video, path: out/, retention-days: 1}
      - name: Ménage (voix envoyée)
        if: success() && inputs.voix != ''
        env: {GH_TOKEN: "${{ github.token }}", VOIX: "${{ inputs.voix }}"}
        run: |
          SHA=$(gh api "repos/$GITHUB_REPOSITORY/contents/$VOIX" --jq .sha) && \
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/contents/$VOIX" -f message="Ménage : voix utilisée" -f sha="$SHA" -f branch=main > /dev/null || echo "ménage ignoré"

  # Copie dans le site de l'appli (GitHub Pages) pour que l'iPhone puisse lire la vidéo.
  # Une seule copie à la fois (pas de conflit si plusieurs vidéos finissent ensemble).
  appli:
    needs: video
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency: {group: publier-appli, cancel-in-progress: false}
    steps:
      - uses: actions/download-artifact@v4
        with: {name: video, path: out}
      - name: Copie dans le site de l'appli
        env: {TOKEN: "${{ secrets.PUBLIER_TOKEN }}", UID_: "${{ inputs.uid }}", OWNER: "${{ github.repository_owner }}", GARDER: "12"}
        run: |
          if [ -z "$TOKEN" ]; then echo "::warning::Lecture dans l'appli non activée (Profil → Lecture des vidéos)"; exit 0; fi
          git clone -q --depth 1 "https://x-access-token:$TOKEN@github.com/$OWNER/thinklivre-app.git" site && cd site
          mkdir -p "v/$UID_" && cp ../out/video.mp4 ../out/miniature.jpg "v/$UID_/"
          python3 - <<'PY'
          import json, os, time, shutil
          uid = os.environ["UID_"]; garder = int(os.environ["GARDER"]); f = "v/liste.json"
          liste = json.load(open(f)) if os.path.exists(f) else []
          liste = [x for x in liste if x["uid"] != uid] + [{"uid": uid, "t": int(time.time())}]
          while len(liste) > garder:
              vieux = liste.pop(0); shutil.rmtree(f"v/{vieux['uid']}", ignore_errors=True)
          json.dump(liste, open(f, "w"))
          PY
          # une seule « photo » du site (l'historique ne grossit pas avec les vidéos)
          git config user.name "THINK LIVRE Studio"; git config user.email "studio@users.noreply.github.com"
          git checkout -q --orphan tmp && git add -A && git commit -qm "Site + vidéos récentes" && git push -q -f origin tmp:main
